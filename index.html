<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Finance FLow - Small Business Budgeting Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1A2A33;
            --paper: #F1EEE6;
            --card: #FBF9F4;
            --line: #D2CBB8;
            --muted: #6B6455;
            --green: #3D6B52;
            --rust:  #9C4A2E;
            --gold: #B8862F;

        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Times New Roman', Times, serif;
            font-size: 15px;
            line-height: 1.5;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 20px 60px;

        }

        h1 {
            font-family: 'Source Serif 4', serif;
            font-weight: 600;
            font-size: 1.9rem;
            margin: 0 0 2px;
        }

        .sub { 
            color: var(--muted);
            margin: 0 0 22px;
            font-size: 0.92rem;
        }

        .summary {
            display: flex;
            border: 1px solid var(--line);
            border-radius: 2px;
            margin-bottom: 26px;
            overflow: hidden;

        }

        .sum-cell {
            flex: 1;
            padding: 14px 16px;
            border-right: 1px solid var(--line);

        }

        .sum-cell:last-child { border-right: none; }

        .sum-label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .sum-val {
            font-family: 'Source Serif 4', serif;
            font-size: 1.35rem;
            font-weight: 600
        }

        .sum-val.income  { color: var(--green); }
        .sum-val.expense { color: var(--rust); }

                section { margin-bottom: 30px; }

        h2 {
            font-family: 'Source Serif 4', serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 12px;
        }

        form.entry {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field label {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .field input, .field select {
            font-family: 'IBM Plex Sans';
            font-size: 0.9rem;
            padding: 7px 8px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: var(--card);
            color: var(--ink);
        }

        .field.grow { flex: 1; min-width: 140px; }
        .field.date { width: 130px; }
        .field.amt  { width: 100px; }
        .field.type select, .field.cat select { width: 120px; }

        button.add {
            background: var(--ink);
            color: var(--paper);
            border: none;
            padding: 8px 16px;
            border-radius: 2px;
            font-size: 0.88rem;
            cursor: pointer;
            font-family: 'IBM Plex Sans';
            font-weight: 500;
        }

        button.add:hover { opacity: 0.88; }


    </style>
</head>
<body>
    <div class="wrap">
        <h1>Finance Flow</h1>
        <p class="sub">A running record of cash flow</p>
                <div class="summary">
            <div class="sum-cell">
                <div class="sum-label">Revenue</div>
                <div class="sum-val income" id="sumIncome">£0.00</div>
            </div>
            <div class="sum-cell">
                <div class="sum-label">Costs</div>
                <div class="sum-val expense" id="sumExpense">£0.00</div>
            </div>
            <div class="sum-cell">
                <div class="sum-label">Net</div>
                <div class="sum-val" id="sumNet">£0.00</div>
            </div>
        </div>

        <section>
            <h2>Add an entry</h2>
            <form class="entry" id="entryForm">
                <div class="field date">
                    <label>Date</label>
                    <input type="date" id="fDate" required>
                </div>
                <div class="field grow">
                    <label>Description</label>
                    <input type="text" id="fDesc" placeholder="e.g. Office supplies" required>
                </div>
                <div class="field type">
                    <label>Type</label>
                    <select id="fType">
                        <option value="expense">Cost</option>
                        <option value="income">Revenue</option>
                    </select>
                </div>
                <div class="field cat">
                    <label>Category</label>
                    <select id="fCat">
                        <option value="Payroll">Payroll</option>
                        <option value="Rent">Rent</option>
                        <option value="Supplies">Supplies</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Software">Software</option>
                        <option value="Travel">Travel</option>
                        <option value="Taxes">Taxes</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="field amt">
                    <label>Amount</label>
                    <input type="number" id="fAmt" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <button class="add" type="submit">Add</button>
            </form>
        </section>
        
    </div>
</body>
</html>
