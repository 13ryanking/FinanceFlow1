<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Finance FLow - Small Business Budgeting Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1A2A33;
            --paper: #F1EEE6;
            --card: #FBF9F4;
            --line: #D2CBB8;
            --muted: #6B6455;
            --green: #3D6B52;
            --rust:  #9C4A2E;
            --gold: #B8862F;

        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Times New Roman', Times, serif;
            font-size: 15px;
            line-height: 1.5;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 20px 60px;

        }

        h1 {
            font-family: 'Source Serif 4', serif;
            font-weight: 600;
            font-size: 1.9rem;
            margin: 0 0 2px;
        }

        .sub { 
            color: var(--muted);
            margin: 0 0 22px;
            font-size: 0.92rem;
        }

        .summary {
            display: flex;
            border: 1px solid var(--line);
            border-radius: 2px;
            margin-bottom: 26px;
            overflow: hidden;

        }

        .sum-cell {
            flex: 1;
            padding: 14px 16px;
            border-right: 1px solid var(--line);

        }

        .sum-cell:last-child { border-right: none; }

        .sum-label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .sum-val {
            font-family: 'Source Serif 4', serif;
            font-size: 1.35rem;
            font-weight: 600
        }

        .sum-val.income  { color: var(--green); }
        .sum-val.expense { color: var(--rust); }

    </style>
</head>
<body>
    <div class="wrap">
        <h1>Finance Flow</h1>
        <p class="sub">A running record of where the business's money goes</p>
    </div>
</body>
</html>
