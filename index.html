<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Finance FLow - Small Business Budgeting Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1A2A33;
            --paper: #F1EEE6;
            --card: #FBF9F4;
            --line: #D2CBB8;
            --muted: #6B6455;
            --green: #3D6B52;
            --rust:  #9C4A2E;
            --gold: #B8862F;

        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Times New Roman', Times, serif;
            font-size: 15px;
            line-height: 1.5;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 20px 60px;

        }

        h1 {
            font-family: 'Source Serif 4', serif;
            font-weight: 600;
            font-size: 1.9rem;
            margin: 0 0 2px;
        }

        .sub { 
            color: var(--muted);
            margin: 0 0 22px;
            font-size: 0.92rem;
        }

        .summary {
            display: flex;
            border: 1px solid var(--line);
            border-radius: 2px;
            margin-bottom: 26px;
            overflow: hidden;

        }

        .sum-cell {
            flex: 1;
            padding: 14px 16px;
            border-right: 1px solid var(--line);

        }

        .sum-cell:last-child { border-right: none; }

        .sum-label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .sum-val {
            font-family: 'Source Serif 4', serif;
            font-size: 1.35rem;
            font-weight: 600
        }

        .sum-val.income  { color: var(--green); }
        .sum-val.expense { color: var(--rust); }

                section { margin-bottom: 30px; }

        h2 {
            font-family: 'Source Serif 4', serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 12px;
        }

        form.entry {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field label {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .field input, .field select {
            font-family: 'IBM Plex Sans';
            font-size: 0.9rem;
            padding: 7px 8px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: var(--card);
            color: var(--ink);
        }

        .field.grow { flex: 1; min-width: 140px; }
        .field.date { width: 130px; }
        .field.amt  { width: 100px; }
        .field.type select, .field.cat select { width: 120px; }

        button.add {
            background: var(--ink);
            color: var(--paper);
            border: none;
            padding: 8px 16px;
            border-radius: 2px;
            font-size: 0.88rem;
            cursor: pointer;
            font-family: 'IBM Plex Sans';
            font-weight: 500;
        }

        button.add:hover { opacity: 0.88; }

                .bars {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar-label {
            width: 110px;
            font-size: 0.82rem;
            color: var(--muted);
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            height: 9px;
            background: var(--card);
            border-radius: 1px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--rust);
            border-radius: 1px;
        }

        .bar-amt {
            width: 70px;
            text-align: right;
            font-size: 0.82rem;
        }

        .empty {
            color: var(--muted);
            font-size: 0.88rem;
            font-style: italic;
        }

        .ledger-list { border-top: 1px solid var(--line); }

        .tx-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 0.88rem;
        }

        .tx-date { width: 78px; color: var(--muted); flex-shrink: 0; }
        .tx-desc { flex: 1; min-width: 0; }
        .tx-cat  { width: 100px; color: var(--muted); flex-shrink: 0; font-size: 0.8rem; }
        .tx-amt  { width: 90px; text-align: right; flex-shrink: 0; }
        .tx-amt.income  { color: var(--green); }
        .tx-amt.expense { color: var(--rust); }

        .tx-del {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .tx-del:hover { color: var(--rust); }



    </style>
</head>
<body>
    <div class="wrap">
        <h1>Finance Flow</h1>
        <p class="sub">A running record of cash flow</p>
                <div class="summary">
            <div class="sum-cell">
                <div class="sum-label">Revenue</div>
                <div class="sum-val income" id="sumIncome">£0.00</div>
            </div>
            <div class="sum-cell">
                <div class="sum-label">Costs</div>
                <div class="sum-val expense" id="sumExpense">£0.00</div>
            </div>
            <div class="sum-cell">
                <div class="sum-label">Net</div>
                <div class="sum-val" id="sumNet">£0.00</div>
            </div>
        </div>

        <section>
            <h2>Add an entry</h2>
            <form class="entry" id="entryForm">
                <div class="field date">
                    <label>Date</label>
                    <input type="date" id="fDate" required>
                </div>
                <div class="field grow">
                    <label>Description</label>
                    <input type="text" id="fDesc" placeholder="e.g. Office supplies" required>
                </div>
                <div class="field type">
                    <label>Type</label>
                    <select id="fType">
                        <option value="expense">Cost</option>
                        <option value="income">Revenue</option>
                    </select>
                </div>
                <div class="field cat">
                    <label>Category</label>
                    <select id="fCat">
                        <option value="Payroll">Payroll</option>
                        <option value="Rent">Rent</option>
                        <option value="Supplies">Supplies</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Software">Software</option>
                        <option value="Travel">Travel</option>
                        <option value="Taxes">Taxes</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="field amt">
                    <label>Amount</label>
                    <input type="number" id="fAmt" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <button class="add" type="submit">Add</button>
            </form>

        </section>
        

        <section>
            <h2>Costs by category</h2>
            <div class="bars" id="bars"></div>
        </section>

        <section>
            <h2>Transactions</h2>
            <div class="ledger-list" id="txList"></div>
        </section>


    </div>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <script>

            apiKey: "AIzaSyDv2mmwJOutr4OXSPNaHdF6Aq_7imABZY4",
            authDomain: "financeflow-991b2.firebaseapp.com",
            projectId: "financeflow-991b2",
            storageBucket: "financeflow-991b2.firebasestorage.app",
            messagingSenderId: "193102453180",
            appId: "1:193102453180:web:0ba6b9f3884e342cac33b9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
        <script>
        const CATEGORIES = ['Payroll', 'Rent', 'Supplies', 'Marketing', 'Software', 'Travel', 'Taxes', 'Other'];
        const INCOME_CAT = 'Revenue';
        let entries = [];

        function load() {
            try {
                const raw = localStorage.getItem('financeflow_data');
                if (raw) entries = JSON.parse(raw);
            } catch (e) {
                console.warn('load failed', e);
            }
        }

        function save() {
            try {
                localStorage.setItem('financeflow_data', JSON.stringify(entries));
            } catch (e) {
                console.warn('save failed', e);
            }
        }

        function fmt(n) {
            const s = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return (n < 0 ? '-' : '') + '£' + s;
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function render() {
            let income = 0, expense = 0;
            const catTotals = {};

            entries.forEach(e => {
                if (e.type === 'income') {
                    income += e.amount;
                } else {
                    expense += e.amount;
                    catTotals[e.category] = (catTotals[e.category] || 0) + e.amount;
                }
            });

            document.getElementById('sumIncome').textContent = fmt(income);
            document.getElementById('sumExpense').textContent = fmt(expense);
            const net = income - expense;
            const netEl = document.getElementById('sumNet');
            netEl.textContent = (net < 0 ? '-' : '') + fmt(Math.abs(net));
            netEl.style.color = net >= 0 ? 'var(--green)' : 'var(--rust)';

            const barsEl = document.getElementById('bars');
            const catArr = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
            if (catArr.length === 0) {
                barsEl.innerHTML = '<div class="empty">No costs logged yet.</div>';
            } else {
                const max = catArr[0][1];
                barsEl.innerHTML = catArr.map(([cat, amt]) => `
                    <div class="bar-row">
                        <div class="bar-label">${cat}</div>
                        <div class="bar-track"><div class="bar-fill" style="width:${(amt / max * 100).toFixed(1)}%"></div></div>
                        <div class="bar-amt">${fmt(amt)}</div>
                    </div>`).join('');
            }

            const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
            const listEl = document.getElementById('txList');
            if (sorted.length === 0) {
                listEl.innerHTML = '<div class="empty" style="padding:14px 0;">Nothing logged yet — add your first entry above.</div>';
            } else {
                listEl.innerHTML = sorted.map(e => `
                    <div class="tx-row">
                        <div class="tx-date">${e.date.slice(5)}</div>
                        <div class="tx-desc">${escapeHtml(e.desc)}</div>
                        <div class="tx-cat">${e.category}</div>
                        <div class="tx-amt ${e.type}">${e.type === 'income' ? '+' : '−'}${fmt(e.amount)}</div>
                        <button class="tx-del" data-id="${e.id}" title="Delete">✕</button>
                    </div>`).join('');

                listEl.querySelectorAll('.tx-del').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = Number(btn.dataset.id);
                        entries = entries.filter(e => e.id !== id);
                        save();
                        render();
                    });
                });
            }
        }

        document.getElementById('entryForm').addEventListener('submit', (ev) => {
            ev.preventDefault();
            const dateEl = document.getElementById('fDate');
            const descEl = document.getElementById('fDesc');
            const typeEl = document.getElementById('fType');
            const catEl = document.getElementById('fCat');
            const amtEl = document.getElementById('fAmt');
            const amount = parseFloat(amtEl.value);

            if (!dateEl.value || !descEl.value || isNaN(amount) || amount <= 0) return;

            entries.push({
                id: Date.now(),
                date: dateEl.value,
                desc: descEl.value,
                type: typeEl.value,
                category: typeEl.value === 'income' ? INCOME_CAT : catEl.value,
                amount: amount
            });

            save();
            render();
            descEl.value = '';
            amtEl.value = '';
            descEl.focus();
        });

        document.getElementById('fDate').valueAsDate = new Date();
        load();
        render();
        console.log("Firebase apps connected:", firebase.apps.length)
    </script>



</body>

</html>
