<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Finance FLow - Small Business Budgeting Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 

</head>
<body>
    <div class="wrap">
        <div id="authScreen">
            <h2 id="authTitle">Log in</h2>
            <form id="authForm">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="authEmail" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" id="authPassword" required minlength="6">
                </div>
                <button type="submit" id="authSubmit">Log in</button>
                <div id="authError"></div>
            </form>
            <button id="authToggle" type="button">Need an account? Sign up</button>
        </div>
        
        <div id="appContent">
            <button id="logoutBtn" type="button">Log out</button>
        

        <h1>Finance Flow</h1>
        <p class="sub">A running record of cash flow</p>
                <div class="summary">
            <div class="sum-cell">
                <div class="sum-label">Revenue</div>
                <div class="sum-val income" id="sumIncome">£0.00</div>
            </div>
            <div class="sum-cell">
                <div class="sum-label">Costs</div>
                <div class="sum-val expense" id="sumExpense">£0.00</div>
            </div>
            <div class="sum-cell">
                <div class="sum-label">Net</div>
                <div class="sum-val" id="sumNet">£0.00</div>
            </div>
            <div class="sum-cell">
                <div class="sum-label">Budget</div>
                <input type="number" id="budgetInput" class="budget-input" min="0" step="0.01" placeholder="None">
            </div>
            <div class="sum-cell">
                <div class="sum-label">Costs</div>
                <div class="sum-val expense" id="sumExpense">£0.00</div>
                <div class="budget-warn" id="budgetWarn"></div>
            </div>

        </div>

        <section>
            <h2>Add an entry</h2>
            <form class="entry" id="entryForm">
                <div class="field date">
                    <label>Date</label>
                    <input type="date" id="fDate" required>
                </div>
                <div class="field grow">
                    <label>Description</label>
                    <input type="text" id="fDesc" placeholder="e.g. Office supplies" required>
                </div>
                <div class="field type">
                    <label>Type</label>
                    <select id="fType">
                        <option value="expense">Cost</option>
                        <option value="income">Revenue</option>
                    </select>
                </div>
                <div class="field cat">
                    <label>Category</label>
                    <select id="fCat">
                        <option value="Payroll">Payroll</option>
                        <option value="Rent">Rent</option>
                        <option value="Supplies">Supplies</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Software">Software</option>
                        <option value="Travel">Travel</option>
                        <option value="Taxes">Taxes</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="field amt">
                    <label>Amount</label>
                    <input type="number" id="fAmt" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <button class="add" type="submit">Add</button>
            </form>
        </section>

        <section>
            <h2>Costs by category</h2>
            <div class="bars" id="bars"></div>
        </section>

        <section>
            <h2>Transactions</h2>
            <div class="ledger-list" id="txList"></div>
        </section>


        </div>
    </div>
        <div id="confirmOverlay">
        <div class="confirm-box">
            <h3 id="confirmTitle"></h3>
            <p id="confirmMessage"></p>
            <div class="confirm-actions">
                <button type="button" id="confirmCancel">Cancel</button>
                <button type="button" id="confirmOk">Delete</button>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>

</html>
